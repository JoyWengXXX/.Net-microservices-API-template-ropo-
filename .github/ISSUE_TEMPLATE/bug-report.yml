name: "🐛 Bug 修復"
description: "系統功能出現異常或錯誤"
title: "[Bug] "
body:
  - type: dropdown
    id: urgency
    attributes:
      label: "緊急程度"
      options:
        - "一般（正常排程）"
        - "緊急（需優先處理）"
        - "非常緊急（需立即處理）"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "問題描述"
      description: "發生了什麼問題？在哪個功能或頁面？"
      placeholder: |
        例：在管線維修查詢頁面，點擊「查詢」按鈕後畫面一直轉圈，沒有回傳結果。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "重現步驟"
      description: "如何重現這個問題，請一步一步說明"
      placeholder: |
        1. 進入「管線維修查詢」頁面
        2. 輸入案件編號 12345
        3. 點擊「查詢」按鈕
        4. 畫面持續轉圈無回應
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "預期應有的行為"
      description: "正常情況下應該要發生什麼"
      placeholder: |
        例：應該要顯示對應案件的列表資料。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "實際發生的行為"
      description: "實際上看到的結果是什麼"
      placeholder: |
        例：畫面持續轉圈，約 30 秒後顯示錯誤訊息「系統異常，請稍後再試」。
    validations:
      required: true

  - type: textarea
    id: ref
    attributes:
      label: "備註 / 截圖"
      description: "錯誤截圖、發生時間、特定帳號或資料才會重現等補充資訊"
      placeholder: |
        例：只有特定帳號會發生
        例：附件截圖（可直接貼圖）
